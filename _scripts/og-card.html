<!DOCTYPE html>
<!--
  Source for assets/og.png — the 1200x630 social share card.

  This is not linked from the site; it exists so the image can be
  regenerated. It is built from the same tokens as assets/style.css,
  so if the headline or the service lines change on the homepage,
  update this file and re-export.

  To re-export (any headless-browser screenshot tool works):
    1. Serve the repo:  py -m http.server 8000
    2. Open http://localhost:8000/_scripts/og-card.html at exactly
       1200x630 and wait for the webfonts to load.
    3. Screenshot the viewport and save as assets/og.png.

  Keep the output at exactly 1200x630 — og:image:width and
  og:image:height are declared in every page's <head>.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --pine: #1C3A30;
    --paper: #F3F2ED;
    --brass-lt: #D9B24C;
    --rule-dark: rgba(243, 242, 237, 0.16);
    --muted-dark: rgba(243, 242, 237, 0.72);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--pine);
    color: var(--paper);
    font-family: 'IBM Plex Sans', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 64px 72px 0;
  }
  .wordmark { font-size: 27px; font-weight: 600; letter-spacing: 0.005em; }
  h1 {
    font-size: 78px;
    font-weight: 600;
    line-height: 1.04;
    letter-spacing: -0.03em;
    max-width: 17ch;
    margin-top: 54px;
  }
  .lede {
    font-family: 'IBM Plex Serif', serif;
    font-size: 25px;
    line-height: 1.5;
    color: var(--muted-dark);
    max-width: 52ch;
    margin-top: 26px;
  }
  .strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--rule-dark);
    border-top: 1px solid var(--rule-dark);
    margin: 0 -72px 0 0;
  }
  .strip div { background: var(--pine); padding: 26px 26px 30px; }
  .strip div:first-child { padding-left: 0; }
  .strip .is-research { box-shadow: inset 2px 0 0 var(--brass-lt); }
  .name { display: block; font-size: 22px; font-weight: 600; }
  .is-research .name { color: var(--brass-lt); }
  .domain {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 21px;
    color: var(--muted-dark);
    float: right;
  }
</style>
</head>
<body>
  <div>
    <span class="domain">sumosols.com</span>
    <div class="wordmark">Sumo Solutions</div>
    <h1>Apps that keep working after we leave.</h1>
    <p class="lede">Mobile apps for iOS and Android — including the AI features inside them — for founders, creators, and local businesses.</p>
  </div>

  <div class="strip">
    <div><span class="name">Mobile apps</span></div>
    <div><span class="name">AI-enabled apps</span></div>
    <div><span class="name">Software &amp; websites</span></div>
    <div class="is-research"><span class="name">Security research</span></div>
  </div>
</body>
</html>
